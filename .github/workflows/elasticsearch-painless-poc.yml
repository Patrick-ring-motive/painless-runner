name: Elasticsearch Painless POC

on:
  workflow_dispatch:

jobs:
  painless-poc:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Elasticsearch image
        id: cache-es
        uses: actions/cache@v4
        with:
          path: ~/es-image.tar
          key: es-image-8.15.0

      - name: Load or pull Elasticsearch image
        run: |
          start=$(date +%s)
          if [ -f ~/es-image.tar ]; then
            docker load -i ~/es-image.tar
          else
            docker pull docker.elastic.co/elasticsearch/elasticsearch:8.15.0
            docker save docker.elastic.co/elasticsearch/elasticsearch:8.15.0 -o ~/es-image.tar
          fi
          echo "Image ready in $(( $(date +%s) - start ))s"

      - name: Run Elasticsearch container
        run: |
          docker run -d --name es \
            -p 9200:9200 \
            -e discovery.type=single-node \
            -e xpack.security.enabled=false \
            -e xpack.ml.enabled=false \
            -e xpack.watcher.enabled=false \
            -e xpack.monitoring.collection.enabled=false \
            -e ES_JAVA_OPTS="-Xms256m -Xmx256m" \
            docker.elastic.co/elasticsearch/elasticsearch:8.15.0

      - name: Wait for Elasticsearch to be ready
        run: |
          start=$(date +%s)
          for i in $(seq 1 100); do
            if curl -sf http://localhost:9200 >/dev/null; then
              echo "Elasticsearch is up after $(( $(date +%s) - start ))s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:9200 || (echo "Elasticsearch failed to start"; docker logs es; exit 1)

      - name: Execute Painless script
        run: |
          curl -s -X POST "http://localhost:9200/_scripts/painless/_execute" \
            -H 'Content-Type: application/json' \
            -d '{
              "script": {
                "source": "int x = params.a; int y = params.b; return x + y;",
                "params": { "a": 5, "b": 7 }
              }
            }' | tee painless_output.json

      - name: Print output
        run: |
          echo "---- Painless script result ----"
          cat painless_output.json | python3 -m json.tool || cat painless_output.json

      - name: Stop container
        if: always()
        run: docker rm -f es || true
