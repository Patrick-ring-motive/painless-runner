name: Elasticsearch Painless POC

on:
  workflow_dispatch:

env:
  ES_IMAGE: elasticsearch:8.15.0  # Docker Hub mirror — beat docker.elastic.co by ~20% in testing

jobs:
  painless-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Increase Docker pull concurrency
        run: |
          echo '{"max-concurrent-downloads": 10}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Run Elasticsearch container
        run: |
          docker run -d --name es \
            -p 9201:9200 \
            -e discovery.type=single-node \
            -e ingest.geoip.downloader.enabled=false \
            -e bootstrap.memory_lock=true \
            -e xpack.security.enabled=false \
            -e xpack.ml.enabled=false \
            -e xpack.watcher.enabled=false \
            -e xpack.monitoring.collection.enabled=false \
            -e xpack.security.autoconfiguration.enabled=false \
            -e xpack.security.enrollment.enabled=false \
            -e 'node.roles=["master", "data"]' \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m -XX:-UseG1GC -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -Xrs -XX:+UnlockExperimentalVMOptions -XX:+DisableAttachMechanism" \
            "${{ env.ES_IMAGE }}"

      - name: Wait for Elasticsearch to be ready
        run: |
          start=$(date +%s)
          until curl -sf http://localhost:9201 >/dev/null; do
            sleep 0.05
          done
          curl -sf http://localhost:9201 || (echo "Elasticsearch failed to start"; docker logs es; exit 1)

      - name: Show GC / startup timing
        run: docker logs es 2>&1 | grep -E '\[(gc|startuptime)' || true

      - name: Run tunnel until idle
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "CLOUDFLARE_TUNNEL_TOKEN secret must be set"
            exit 1
          fi

          node --version

          docker run -d --name cf-tunnel --network host \
            cloudflare/cloudflared:latest \
            tunnel --metrics 127.0.0.1:20241 --no-autoupdate run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN"

          until curl -sf http://127.0.0.1:20241/metrics >/dev/null; do
            if ! docker inspect -f '{{.State.Running}}' cf-tunnel | grep -q true; then
              docker logs cf-tunnel
              exit 1
            fi
            sleep 1
          done

          cat > /tmp/request-logger.mjs <<'EOF'
          import http from "node:http";
          import fs from "node:fs";
          import { Readable } from "node:stream";

          const activityFile = "/tmp/last-tunnel-request";
          fs.writeFileSync(activityFile, String(Date.now()));

          http.createServer(async (request, response) => {
            try {
              fs.writeFileSync(activityFile, String(Date.now()));
              console.log(`[request] ${new Date().toISOString()} ${request.method} ${request.url}`);

              const hasBody = request.method !== "GET" && request.method !== "HEAD";
              const upstream = await fetch(`http://127.0.0.1:9201${request.url}`, {
                method: request.method,
                headers: request.headers,
                body: hasBody ? request : undefined,
                duplex: hasBody ? "half" : undefined,
              });

              response.writeHead(upstream.status, Object.fromEntries(upstream.headers));
              if (upstream.body) {
                Readable.fromWeb(upstream.body).pipe(response);
              } else {
                response.end();
              }
            } catch (error) {
              console.error(`[proxy error] ${error.message}`);
              if (!response.headersSent) response.writeHead(502);
              response.end("Elasticsearch is unavailable");
            }
          }).listen(9200, "127.0.0.1", () => console.log("Request logger listening on port 9200"));
          EOF

          date +%s000 > /tmp/last-tunnel-request
          node /tmp/request-logger.mjs &

          while true; do
            now_ms=$(date +%s000)
            last_ms=$(cat /tmp/last-tunnel-request)
            elapsed=$(( (now_ms - last_ms) / 1000 ))
            remaining=$((900 - elapsed))
            if [ "$remaining" -le 0 ]; then
              echo "No tunnel requests for 15 minutes; stopping"
              break
            fi
            printf '[idle timer] %02d:%02d remaining\n' $((remaining / 60)) $((remaining % 60))
            sleep 10
          done

      - name: Show tunnel logs
        if: always()
        run: docker logs cf-tunnel 2>&1 || true

      - name: Stop containers
        if: always()
        run: docker rm -f cf-tunnel es || true
