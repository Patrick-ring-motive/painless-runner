name: Elasticsearch Painless POC

on:
  workflow_dispatch:
    inputs:
      callback_token:
        required: true
        type: string
      tunnel_token:
        required: true
        type: string
      worker_callback_url:
        required: true
        type: string

env:
  ES_IMAGE: elasticsearch:8.15.0  # Docker Hub mirror — beat docker.elastic.co by ~20% in testing

jobs:
  painless-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Increase Docker pull concurrency
        run: |
          echo '{"max-concurrent-downloads": 10}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Run Elasticsearch container
        run: |
          docker run -d --name es \
            -p 9201:9200 \
            -e discovery.type=single-node \
            -e ingest.geoip.downloader.enabled=false \
            -e bootstrap.memory_lock=true \
            -e xpack.security.enabled=false \
            -e xpack.ml.enabled=false \
            -e xpack.watcher.enabled=false \
            -e xpack.monitoring.collection.enabled=false \
            -e xpack.security.autoconfiguration.enabled=false \
            -e xpack.security.enrollment.enabled=false \
            -e 'node.roles=["master", "data"]' \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m -XX:-UseG1GC -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -Xrs -XX:+UnlockExperimentalVMOptions -XX:+DisableAttachMechanism" \
            "${{ env.ES_IMAGE }}"

      - name: Wait for Elasticsearch to be ready
        run: |
          for _ in $(seq 1 300); do
            if curl -sf http://localhost:9201 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:9201 || (echo "Elasticsearch failed to start"; docker logs es; exit 1)

      - name: Show GC / startup timing
        run: docker logs es 2>&1 | grep -E '\[(gc|startuptime)' || true

      - name: Run tunnel until idle
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ inputs.tunnel_token }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          WORKER_CALLBACK_URL: ${{ inputs.worker_callback_url }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "CLOUDFLARE_TUNNEL_TOKEN secret must be set"
            exit 1
          fi
          if [ -z "$CALLBACK_TOKEN" ] || [ -z "$WORKER_CALLBACK_URL" ]; then
            echo "CALLBACK_TOKEN secret and WORKER_CALLBACK_URL variable must be set"
            exit 1
          fi

          node --version

          docker run -d --name cf-tunnel --network host \
            cloudflare/cloudflared:latest \
            tunnel --metrics 127.0.0.1:20241 --no-autoupdate run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN"

          for _ in $(seq 1 300); do
            if curl -sf http://127.0.0.1:20241/metrics >/dev/null; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' cf-tunnel | grep -q true; then
              docker logs cf-tunnel
              exit 1
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:20241/metrics >/dev/null || (echo "Tunnel failed to start"; docker logs cf-tunnel; exit 1)

          cat > /tmp/request-logger.mjs <<'EOF'
          import http from "node:http";
          import fs from "node:fs";

          const activityFile = "/tmp/last-tunnel-request";
          fs.writeFileSync(activityFile, String(Date.now()));

          const ansi = {
            reset: "\x1b[0m",
            star: "\x1b[94m",
            curly: "\x1b[95m",
            square: "\x1b[35m",
            paren: "\x1b[33m",
            number: "\x1b[96m",
            symbol: "\x1b[92m",
            yellow: "\x1b[93m",
            red: "\x1b[91m",
            x: "\x1b[97m",
          };
          const syntaxPattern = /(\b(?:Y|Yellow)\b)|(\b(?:R|Red)\b)|(\bx\b)|([*•]+)|([{}‘’']+)|([\[\]“”"]+)|([()]+)|(\d+)|([^a-zA-Z0-9\s*•{}‘’'\[\]“”"()]+)/gi;
          const syntaxColors = ["yellow", "red", "x", "star", "curly", "square", "paren", "number", "symbol"];

          function syntaxHighlight(value) {
            return String(value).replace(syntaxPattern, (...match) => {
              const groups = match.slice(1, 10);
              const index = groups.findIndex(Boolean);
              return index < 0 ? match[0] : `${ansi[syntaxColors[index]]}${match[0]}${ansi.reset}`;
            });
          }

          function log(color, label, value = "") {
            console.log(`${ansi[color]}[${label}]${ansi.reset}${value ? ` ${syntaxHighlight(value)}` : ""}`);
          }

          function safeHeaders(headers) {
            return Object.fromEntries(Object.entries(headers).map(([name, value]) => [
              name,
              /authorization|cf-access-client-secret/i.test(name) ? "[redacted]" : value,
            ]));
          }

          http.createServer(async (request, response) => {
            const started = performance.now();
            try {
              fs.writeFileSync(activityFile, String(Date.now()));

              const hasBody = request.method !== "GET" && request.method !== "HEAD";
              const chunks = [];
              if (hasBody) {
                for await (const chunk of request) chunks.push(chunk);
              }
              const requestBody = Buffer.concat(chunks);
              log("star", "request", `${new Date().toISOString()} ${request.method} ${request.url}`);
              log("square", "request headers", JSON.stringify(safeHeaders(request.headers)));
              log("curly", "request body", requestBody.toString("utf8"));

              const headers = new Headers(request.headers);
              for (const name of ["accept-encoding", "connection", "content-length", "host", "transfer-encoding"]) {
                headers.delete(name);
              }

              const upstream = await fetch(`http://127.0.0.1:9201${request.url}`, {
                method: request.method,
                headers,
                body: hasBody ? requestBody : undefined,
              });
              const responseBody = Buffer.from(await upstream.arrayBuffer());

              const responseHeaders = new Headers(upstream.headers);
              for (const name of ["connection", "content-encoding", "content-length", "transfer-encoding"]) {
                responseHeaders.delete(name);
              }
              responseHeaders.set("content-length", String(responseBody.length));

              log("paren", "upstream response", `${upstream.status} ${upstream.statusText} ${Math.round(performance.now() - started)}ms`);
              log("square", "upstream headers", JSON.stringify(Object.fromEntries(responseHeaders)));
              log("curly", "upstream body", responseBody.toString("utf8"));

              response.writeHead(upstream.status, Object.fromEntries(responseHeaders));
              response.end(responseBody, () => {
                log("symbol", "response complete", `${request.method} ${request.url} ${Math.round(performance.now() - started)}ms`);
              });
            } catch (error) {
              console.error(`${ansi.red}[proxy error]${ansi.reset} ${syntaxHighlight(error.stack ?? error)}`);
              if (!response.headersSent) response.writeHead(502, { "content-type": "text/plain" });
              response.end("Elasticsearch is unavailable");
            }
          }).listen(9200, "127.0.0.1", async () => {
            log("star", "logger", "Request logger listening on port 9200");
            const callbackUrl = `${process.env.WORKER_CALLBACK_URL.replace(/\/$/, "")}/_internal/tunnel-ready`;
            while (true) {
              try {
                const callback = await fetch(callbackUrl, {
                  method: "POST",
                  headers: { Authorization: `Bearer ${process.env.CALLBACK_TOKEN}` },
                });
                if (callback.ok) {
                  log("symbol", "ready", "Worker readiness callback accepted");
                  break;
                }
                console.error(`${ansi.red}[callback error]${ansi.reset} ${syntaxHighlight(callback.status)}`);
              } catch (error) {
                console.error(`${ansi.red}[callback error]${ansi.reset} ${syntaxHighlight(error.stack ?? error)}`);
              }
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
          });
          EOF

          date +%s000 > /tmp/last-tunnel-request
          node /tmp/request-logger.mjs &

          while true; do
            now_ms=$(date +%s000)
            last_ms=$(cat /tmp/last-tunnel-request)
            elapsed=$(( (now_ms - last_ms) / 1000 ))
            remaining=$((900 - elapsed))
            if [ "$remaining" -le 0 ]; then
              echo "No tunnel requests for 15 minutes; stopping"
              break
            fi
            printf '[idle timer] %02d:%02d remaining\n' $((remaining / 60)) $((remaining % 60))
            sleep 10
          done

      - name: Show tunnel logs
        if: always()
        run: docker logs cf-tunnel 2>&1 || true

      - name: Stop containers
        if: always()
        run: docker rm -f cf-tunnel es || true
