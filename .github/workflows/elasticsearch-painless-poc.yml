name: Elasticsearch Painless POC

on:
  workflow_dispatch:

env:
  ES_IMAGE: elasticsearch:8.15.0  # Docker Hub mirror — beat docker.elastic.co by ~20% in testing

jobs:
  painless-poc:
    runs-on: ubuntu-latest
    steps:
      - name: Increase Docker pull concurrency
        run: |
          echo '{"max-concurrent-downloads": 10}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Pull Elasticsearch image
        run: |
          start=$(date +%s)
          docker pull "${{ env.ES_IMAGE }}"
          echo "Pull took $(( $(date +%s) - start ))s"

      - name: Run Elasticsearch container
        run: |
          docker run -d --name es \
            -p 9200:9200 \
            -e discovery.type=single-node \
            -e ingest.geoip.downloader.enabled=false \
            -e bootstrap.memory_lock=true \
            -e xpack.security.enabled=false \
            -e xpack.ml.enabled=false \
            -e xpack.watcher.enabled=false \
            -e xpack.monitoring.collection.enabled=false \
            -e xpack.security.autoconfiguration.enabled=false \
            -e xpack.security.enrollment.enabled=false \
            -e 'node.roles=["master", "data"]' \
            -e ES_JAVA_OPTS="-Xms256m -Xmx256m -XX:-UseG1GC -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -Xrs -XX:+UnlockExperimentalVMOptions -XX:+DisableAttachMechanism" \
            "${{ env.ES_IMAGE }}"

      - name: Wait for Elasticsearch to be ready
        run: |
          start=$(date +%s)
          until curl -sf http://localhost:9200 >/dev/null; do
            sleep 0.05
          done
          curl -sf http://localhost:9200 || (echo "Elasticsearch failed to start"; docker logs es; exit 1)

      - name: Show GC / startup timing
        run: docker logs es 2>&1 | grep -E '\[(gc|startuptime)' || true

      - name: Execute Painless script
        run: |
          curl -s -X POST "http://localhost:9200/_scripts/painless/_execute" \
            -H 'Content-Type: application/json' \
            -d '{
              "script": {
                "source": "int x = params.a; int y = params.b; return x + y;",
                "params": { "a": 5, "b": 7 }
              }
            }' | tee painless_output.json

      - name: Print output
        run: |
          echo "---- Painless script result ----"
          cat painless_output.json | python3 -m json.tool || cat painless_output.json

      - name: Stop container
        if: always()
        run: docker rm -f es || true
