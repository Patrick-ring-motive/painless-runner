<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painless Script Runner</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #111827;
      color: #e5e7eb;
    }

    h1 {
      margin-bottom: .25rem;
    }

    label {
      display: block;
      margin: 1rem 0 .4rem;
      font-weight: 600;
    }

    input,
    textarea,
    pre,
    button {
      box-sizing: border-box;
      width: 100%;
      border-radius: 6px;
    }

    input,
    textarea,
    pre {
      border: 1px solid #374151;
      background: #030712;
      color: #e5e7eb;
      padding: .75rem;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      font: 14px/1.5 ui-monospace, monospace;
      tab-size: 2;
    }

    #params {
      min-height: 100px;
    }

    button {
      margin-top: 1rem;
      padding: .8rem;
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    pre {
      min-height: 80px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hint {
      color: #9ca3af;
      font-size: .9rem;
    }

    .editor {
      display: grid;
    }

    .editor>textarea,
    .editor>pre {
      grid-area: 1 / 1;
      margin: 0;
      font: 14px/1.5 ui-monospace, monospace;
      tab-size: 2;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .editor>pre {
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      color: #e5e7eb;
    }

    .editor>textarea {
      z-index: 1;
      background: transparent;
      color: transparent;
      caret-color: #fff;
      -webkit-text-fill-color: transparent;
    }

    .editor>textarea::selection {
      background: #264f78;
      -webkit-text-fill-color: transparent;
    }

    .token-star {
      color: cornflowerblue;
    }

    .token-curly {
      color: #ff79c6;
    }

    .token-square {
      color: #ba7dff;
    }

    .token-paren {
      color: orange;
    }

    .token-number {
      color: deepskyblue;
    }

    .token-symbol {
      color: #00ff00;
    }

    .token-yellow {
      color: yellow;
    }

    .token-red {
      color: red;
    }

    .token-x {
      color: #fff;
    }

  </style>
  <script>
    // ==UserScript==
    // @name         electric
    // @namespace    http://tampermonkey.net/
    // @version      2026-06-25
    // @description  try to take over the world!
    // @author       You
    // @match        *://*/*
    // @icon         https://www.google.com/s2/favicons?sz=64&domain=atlassian.net
    // @grant        none
    // ==/UserScript==

    (function() {
      if (location.href.includes('fidelity')) {
        return;
      }
      const _appendChild = Node.prototype.appendChild;
      const _replaceChild = Node.prototype.replaceChild;

      function wrapTextNodes(root = document.body) {
        const walker = document.createTreeWalker(
          root,
          NodeFilter.SHOW_TEXT, {
            acceptNode(node) {
              // Skip empty/whitespace text nodes
              if (!node.nodeValue.trim()) {
                return NodeFilter.FILTER_REJECT;
              }

              const parent = node.parentElement;
              if (!parent) {
                return NodeFilter.FILTER_REJECT;
              }

              // Skip anything under script/style
              if (node.parentNode.closest('script,style,title')) {
                return NodeFilter.FILTER_REJECT;
              }

              // Only direct parents matching :has(*)
              if (!parent.matches(':has(*)')) {
                return NodeFilter.FILTER_REJECT;
              }

              return NodeFilter.FILTER_ACCEPT;
            }
          }
        );

        const nodes = [];

        // Collect first because replacing mutates the tree
        for (let node;
          (node = walker.nextNode());) {
          nodes.push(node);
        }

        for (const text of nodes) {
          const span = document.createElement('span');
          //  span.setAttribute('asdf','asdf');
          _appendChild.call(span, text.cloneNode());

          _replaceChild.call(text.parentNode, span, text);
        }
      }
      (() => {
        const {
          keys,
          values,
          entries
        } = Object;
        const isString = x => typeof x === 'string' || x instanceof String;
        const isObject = x => typeof x === 'object' && x !== null;
        const toArray = x => x?.[Symbol.iterator] ? [...x] : (isObject(x) ? entries(x) : [...String(x)]);
        const stringify = (...args) => {
          const x = args[0];
          try {
            if (isString(x)) {
              return String(x);
            }
            return String(JSON.stringify(...args));
          } catch (e) {
            console.warn(e, ...args.map(Boolean));
            return String(x);
          }
        };
        const re = (...args) => {
          try {
            return RegExp(...args);
          } catch (e) {
            console.warn(e, ...args);
            return RegExp();
          }
        };
        const g = x => re(x, [...new Set(`${x?.flags||''}g`)].join``);
        const _g = x => re(x, String(x?.flags || '').replaceAll('g', ''));
        const rm = (x, y) => String(x).replaceAll(g(y), '');
        const split = (x, y) => String(x).split(_g(y));
        const join = (x = [], y = '') => [...(x[Symbol.iterator] ? x : toArray(x))].map(stringify).join(String(y));
        const test = (x, str) => re(x).test(stringify(str));
        const regexes = {
          star: [/[\*•]+/, 'cornflowerblue'],
          curly: [/[\{\}‘’']+/, '#ff79c6'],
          square: [/[\[\]“”""]+/, '#ba7dff'],
          paren: [/[\(\)]+/, 'orange'],
          number: [/[0-9]+/, 'deepskyblue'],
        };
        const compoundRe = {
          yellow: [/\b(Y|Yellow)\b/, 'yellow'],
          red: [/\b(R|Red)\b/, 'red'],
          x: [/(\bx\b)/, '#ffffff'],
          symbol: [re(`[^a-zA-Z0-9\\s${join(values(regexes).map(x =>x[0].source.slice(1,-2)))}]+`), '#00ff00'],
          ...regexes
        };
        const allRegex = re(join(values(compoundRe).map(x => x[0].source), '|'), 'ig');
        const ts = 'black';
        const sz = '0.1ch';
        globalThis.color ??= (text) =>
          text.replace(allRegex, ch => {
            if (!ch.trim()) {
              return ch;
            }
            for (const key in compoundRe) {
              if (test(compoundRe[key]?.[0], ch)) {
                return `<span class="color-${key}">${rm(ch,/[<>]/g)}</span>`;
              }
            }
            return ch;
          });
        const style = document.createElement('style');
        style.textContent = join(keys(compoundRe).map(key =>
          `.color-${key} ${
      rm(stringify({
        color: `${compoundRe[key]?.[1]} !important`,
        "xxtext-shadow": `-${sz} -${sz} 0 ${ts}, ${sz} -${sz} 0 ${ts}, -${sz} ${sz} 0 ${ts}, ${sz} ${sz} 0 ${ts} !important`,
      },null,2),'"').replace(/!important,?/g,'!important;')
    }`), ' ');
        document.firstElementChild.appendChild(style);
      })();

      (() => {
        let locked;
        const _appendChild = Node.prototype.appendChild;
        const _replaceChild = Node.prototype.replaceChild;

        function wrapTextNodes(root = document.body) {
          const walker = document.createTreeWalker(
            root,
            NodeFilter.SHOW_TEXT, {
              acceptNode(node) {
                // Skip empty/whitespace text nodes
                if (!node.nodeValue.trim()) {
                  return NodeFilter.FILTER_REJECT;
                }

                const parent = node.parentElement;
                if (!parent) {
                  return NodeFilter.FILTER_REJECT;
                }

                // Skip anything under script/style
                if (node.parentNode.closest('script,style,title')) {
                  return NodeFilter.FILTER_REJECT;
                }

                // Only direct parents matching :has(*)
                if (!parent.matches(':has(*)')) {
                  return NodeFilter.FILTER_REJECT;
                }

                return NodeFilter.FILTER_ACCEPT;
              }
            }
          );

          const nodes = [];

          // Collect first because replacing mutates the tree
          for (let node;
            (node = walker.nextNode());) {
            nodes.push(node);
          }

          for (const text of nodes) {
            const span = document.createElement('span');
            //  span.setAttribute('asdf','asdf');
            _appendChild.call(span, text.cloneNode());

            _replaceChild.call(text.parentNode, span, text);
          }
        }

        const isString = (x) => typeof x === "string" || x instanceof String;
        const isNull = (x) => x === null || x === undefined;
        const setHTML = Object.getOwnPropertyDescriptor(Element.prototype, "innerHTML").set;
        (() => {
          const skips = ["SCRIPT", "STYLE", "LINK", "META", "TITLE"];
          const skipCss = skips.map((x) => "" + x + ", " + x + " *").join(", ");
          for (const node of [Node, Element, HTMLElement]) {
            for (const method of [
                "appendChild",
                "insertBefore",
                "removeChild",
                "replaceChild",
                "insertAdjacentElement",
                "before",
                "after",
                "replaceWith",
                "prepend",
                "append",
              ]) {
              (() => {
                const _NodeMethod = node.prototype[method];
                if (!_NodeMethod) {
                  return;
                }
                if (!String(node.prototype[method]).includes('[native code]')) {
                  return;
                }
                node.prototype[method] = Object.setPrototypeOf(function NodeMethod(
                  ...args
                ) {
                  try {
                    if (locked) {
                      return _NodeMethod.apply(this, args);
                    }
                    locked = true;
                    if (
                      (isString(args[0]) || args[0]?.nodeName === "#text") && args[0]?.textContent?.trim?.() &&
                      !this?.matches?.(skipCss)
                    ) {
                      const span = document.createElement("span");
                      setHTML.call(span, globalThis.color(args[0].textContent || ""));
                      args[0] = span;
                    }
                    if (
                      /*["SPAN", "TD","DIV"].includes(args[0]?.tagName) &&*/
                      !args[0]?.children?.length
                    ) {
                      const text = (args[0].textContent || "").trim();
                      if (text) {
                        (args?.[0]?.dataset ?? {}).text = text.replaceAll(
                          String.fromCharCode(34),
                          "quote",
                        );
                      }
                    }
                    if (isString(args[0]))
                      console.log("NodeMethod", method, this, ...args);
                    return _NodeMethod.apply(this, args);
                  } catch (e) {
                    console.warn(e, this, ...args);
                    try {
                      return _NodeMethod.apply(this, args);
                    } catch {
                      return this;
                    }
                  } finally {
                    locked = false;
                  }
                }, _NodeMethod);
              })();
            }
          }
        })();

        (() => {
          const protoMap = {
            textContent: Node.prototype,
            innerText: HTMLElement.prototype
          };
          for (const txt of ["textContent", "innerText"]) {
            const proto = protoMap[txt];
            const _textContent = Object.getOwnPropertyDescriptor(proto, txt);
            if (!String(_textContent.set).includes('[native code]')) {
              continue;
            }
            Object.defineProperty(proto, txt, {
              ..._textContent,
              set(value) {
                try {
                  if (locked) {
                    return _textContent.set.call(this, value);
                  }
                  locked = true;
                  if (!isString(value)) {
                    if (!isNull(value)) {
                      value = String(value);
                    } else {
                      console.warn("value is null or undefined", this, value);
                    }
                  }
                  if (value?.replace) {
                    const val = color(value);
                    if (val !== value) {
                      return setHTML.call(this, val);
                    }
                  }
                  if (_textContent.get.call(this) == value) {
                    return _textContent.get.call(this)
                  }
                  return _textContent.set.call(this, value);
                } catch (e) {
                  console.warn(e, this, value);
                } finally {
                  locked = false;
                }
              },
            });
          }
        })();

        (() => {
          const _parseFromString = DOMParser.prototype.parseFromString;
          if (!String(_parseFromString).includes('[native code]')) {
            return;
          }
          DOMParser.prototype.parseFromString = function parseFromString(...args) {
            try {
              if (locked) {
                return _parseFromString.apply(this, args);
              }
              locked = true;
              const doc = _parseFromString.apply(this, args);
              let elems = doc.body.querySelectorAll('*:not(script):not(style):not(link):not(meta):not(title):not(:has(*)):not([class^="color"],[class^="color"] *)');
              for (const elem of elems) {
                if (!elem?.children?.length) {
                  elem.textContent = (elem.textContent || "");
                }
              }
              return doc;
            } catch (e) {
              console.warn(e, this, ...args);
              return _parseFromString.apply(this, args);
            } finally {
              locked = false;
            }
          };
        })();
        (() => {
          const _insertAdjacentHTML = Element.prototype.insertAdjacentHTML;
          if (!String(_insertAdjacentHTML).includes('[native code]')) {
            return;
          }
          Element.prototype.insertAdjacentHTML = function insertAdjacentHTML(position, text) {
            try {
              if (locked) {
                return _insertAdjacentHTML.call(this, position, text);
              }
              locked = true;
              const parser = new DOMParser();
              const doc = parser.parseFromString(String(text), "text/html");
              text = String(doc.body.innerHTML);
              return _insertAdjacentHTML.call(this, position, text);
            } catch (e) {
              throw e;
            } finally {
              locked = false;
            }
          }
        })();
        (() => {
          const parser = new DOMParser();
          const parse = x => parser.parseFromString(x, "text/html");
          for (const txt of ["innerHTML"]) {
            const _textContent = Object.getOwnPropertyDescriptor(
              Element.prototype,
              txt,
            );
            if (!String(_textContent.set).includes('[native code]')) {
              continue;
            }
            Object.defineProperty(Element.prototype, txt, {
              ..._textContent,
              set(value) {
                try {
                  if (locked) {
                    return _textContent.set.call(this, value);
                  }
                  locked = true;
                  if (isString(value)) {
                    const doc = parse(value);
                    value = String(doc.body.innerHTML);
                  }
                  return _textContent.set.call(this, value);
                } catch (e) {
                  console.warn(e, this, value);
                } finally {
                  locked = false;
                }
              },
            });
          }
        })();
        document.firstElementChild.dataset.location = window.location;
      })();
    })();

  </script>
</head>

<body>
  <h1>Painless Script Runner</h1>
  <div class="hint">Runs scripts through Elasticsearch's Painless execute API.</div>

  <label for="endpoint">Worker endpoint</label>
  <input id="endpoint" type="url" value="https://painless-runner.smokestack.workers.dev/execute">

  <label for="source">Script</label>
  <div class="editor">
    <pre id="source-highlight" aria-hidden="true"></pre>
    <textarea id="source" spellcheck="false">int x = params.a;
int y = params.b;
return x + y;</textarea>
  </div>

  <label for="params">Parameters (JSON)</label>
  <div class="editor">
    <pre id="params-highlight" aria-hidden="true"></pre>
    <textarea id="params" spellcheck="false">{
  "a": 5,
  "b": 7
}</textarea>
  </div>

  <button id="run" type="button">Run script</button>

  <label for="output">Response</label>
  <pre id="output">Ready.</pre>

  <script>
    const endpoint = document.querySelector("#endpoint");
    const source = document.querySelector("#source");
    const params = document.querySelector("#params");
    const sourceHighlight = document.querySelector("#source-highlight");
    const paramsHighlight = document.querySelector("#params-highlight");
    const run = document.querySelector("#run");
    const output = document.querySelector("#output");

    const highlightPattern = /(\b(?:Y|Yellow)\b)|(\b(?:R|Red)\b)|(\bx\b)|([*•]+)|([{}‘’']+)|([\[\]“”"]+)|([()]+)|(\d+)|([^a-zA-Z0-9\s*•{}‘’'\[\]“”"()]+)/gi;
    const highlightClasses = ["yellow", "red", "x", "star", "curly", "square", "paren", "number", "symbol"];
    const escapeHtml = (value) => value.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");

    function highlightedHtml(value) {
      let html = "";
      let offset = 0;
      for (const match of value.matchAll(highlightPattern)) {
        html += escapeHtml(value.slice(offset, match.index));
        const groupIndex = match.slice(1).findIndex(Boolean);
        html += `<span class="token-${highlightClasses[groupIndex]}">${escapeHtml(match[0])}</span>`;
        offset = match.index + match[0].length;
      }
      return html + escapeHtml(value.slice(offset)) + "\n";
    }

    function syncHighlight(textarea, highlight) {
      highlight.innerHTML = highlightedHtml(textarea.value);
      highlight.scrollTop = textarea.scrollTop;
      highlight.scrollLeft = textarea.scrollLeft;
    }

    for (const [textarea, highlight] of [
        [source, sourceHighlight],
        [params, paramsHighlight]
      ]) {
      textarea.addEventListener("input", () => syncHighlight(textarea, highlight));
      textarea.addEventListener("scroll", () => syncHighlight(textarea, highlight));
      syncHighlight(textarea, highlight);
    }

    endpoint.value = localStorage.getItem("painless-endpoint") || endpoint.value;

    source.addEventListener("keydown", (event) => {
      if (event.key !== "Tab") return;
      event.preventDefault();
      const start = source.selectionStart;
      source.setRangeText("  ", start, source.selectionEnd, "end");
      syncHighlight(source, sourceHighlight);
    });

    run.addEventListener("click", async () => {
      run.disabled = true;
      output.textContent = "Running…";

      try {
        const scriptParams = JSON.parse(params.value);
        localStorage.setItem("painless-endpoint", endpoint.value);

        const response = await fetch(endpoint.value, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            script: {
              source: source.value,
              params: scriptParams,
            },
          }),
        });

        const text = await response.text();
        let body;
        try {
          body = JSON.stringify(JSON.parse(text), null, 2);
        } catch {
          body = text;
        }

        output.textContent = `HTTP ${response.status} ${response.statusText}\n\n${body}`;
      } catch (error) {
        output.textContent = `Error: ${error.message}`;
      } finally {
        run.disabled = false;
      }
    });

  </script>
</body>

</html>
